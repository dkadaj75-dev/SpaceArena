<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Orion's Arm</title>
    <meta name="description" content="One-thumb tactical space combat. Fit your ship, manage heat, win the arena." />

    <!-- PWA (ROADMAP §11 6.5). The manifest + service worker are injected at
         build time by vite-plugin-pwa; these tags are what the browser needs
         before the manifest is parsed, plus the iOS-only equivalents. -->
    <meta name="theme-color" content="#0a0f1e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orion's Arm" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        background: #05070d;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Game surfaces are controls, not document text. The editor and actual
         form fields explicitly opt back in below. */
      #renderCanvas,
      #hud,
      #sa-boot {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      :where(input, textarea, [contenteditable]),
      .sa-editor,
      .sa-editor * {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }

      /* ==========================================================
         LAUNCH SEQUENCE (driven by src/game/screens/BootScreen.ts)

         Deliberately inline, static markup with literal colours: this is the
         ONE surface that must be on screen before any JavaScript runs — before
         the module graph is fetched, before the content pack (and therefore the
         theme) exists. Anything theme-driven here could only appear after the
         very wait it is meant to explain.

         Two phases, both on this one node:
           1. PUBLISHER — "SEPTENTRION GAMES" fades up out of black and back
              down into it, ~1s, while the content pack loads behind it.
           2. TITLE — the wordmark over a live nebula shader, with a loading
              indicator. Holds for a minimum beat so the brand registers, and
              longer if loading has not finished.
         ========================================================== */
      #sa-boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-right, 0px) + 16px)
          calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 16px);
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #dbe9ff;
        background: #000;
        opacity: 1;
        transition: opacity 320ms ease-out;
      }
      /* BootScreen.dismiss() sets this, then removes the node after the fade. */
      #sa-boot[data-state="done"] {
        opacity: 0;
        pointer-events: none;
      }

      /* Every phase layer stacks in the same grid cell and is cross-faded by
         opacity — no reflow between phases, and the shader underneath never
         restarts.
         `position: relative` is load-bearing: the backdrop canvas is POSITIONED,
         and a positioned element paints above its in-flow siblings whatever the
         source order. Without this the nebula covers the wordmark. */
      #sa-boot > * {
        grid-area: 1 / 1;
        position: relative;
      }
      #sa-boot > .sa-boot-sky {
        position: fixed;
      }

      /* ---------- phase 1: publisher card ---------- */
      .sa-boot-publisher {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transition: opacity 380ms ease-in-out;
        text-align: center;
      }
      #sa-boot[data-phase="publisher"] .sa-boot-publisher {
        opacity: 1;
      }
      .sa-boot-publisher b {
        font-size: clamp(17px, 3.6vw, 27px);
        font-weight: 600;
        letter-spacing: 0.42em;
        /* The letter-spacing pads the right edge; pull it back so the wordmark
           reads optically centred rather than shifted left. */
        text-indent: 0.42em;
        color: #eaf3ff;
      }
      .sa-boot-publisher i {
        display: block;
        width: 54px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(190, 220, 255, 0.55), transparent);
      }

      /* ---------- phase 2: title screen ---------- */
      /* FIXED, not absolute: an absolutely-positioned child is laid out against
         its parent's PADDING box, so it would still be inset by the safe-area
         padding the rest of the layout needs and would draw a black frame
         around itself. `#sa-boot` sets a stacking context (z-index + the
         opacity transition), so a fixed child still fades out with it. */
      .sa-boot-sky {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition: opacity 700ms ease-in;
      }
      .sa-boot-titlecard {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        /* The star owns the left of a wide frame; the wordmark takes the right
           so the two are not stacked on top of each other. Portrait has no room
           beside it, so the sun moves up (see the `sun` uniform) and this
           centres. */
        justify-self: center;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 620ms ease-out 180ms, transform 620ms ease-out 180ms;
      }
      #sa-boot[data-phase="title"] .sa-boot-sky,
      #sa-boot[data-phase="title"] .sa-boot-titlecard {
        opacity: 1;
        transform: none;
      }
      @media (min-aspect-ratio: 1 / 1) {
        .sa-boot-titlecard {
          justify-self: end;
          margin-right: min(7vw, 110px);
        }
      }
      .sa-boot-wordmark {
        margin: 0;
        font-size: clamp(30px, 8.5vw, 78px);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        line-height: 1;
        color: #f2f8ff;
        text-shadow: 0 0 26px rgba(80, 170, 255, 0.5), 0 2px 30px rgba(0, 0, 0, 0.8);
      }
      .sa-boot-rule {
        width: min(300px, 62vw);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(120, 200, 255, 0.75), transparent);
      }
      .sa-boot-sub {
        font-size: 10.5px;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        color: rgba(190, 215, 245, 0.72);
        text-transform: uppercase;
      }

      /* Names for the stage marks, for screen readers only — without this rule
         they render as a pile of overlapping text in the corner. */
      #sa-boot .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ---------- loading indicator (bottom-right, title phase) ---------- */
      .sa-boot-loader {
        justify-self: end;
        align-self: end;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transition: opacity 400ms ease-out 500ms;
      }
      #sa-boot[data-phase="title"] .sa-boot-loader {
        opacity: 1;
      }
      /* Settled marks turn the ring's track brighter as stages land, so the
         indicator carries real progress rather than spinning decoratively. */
      .sa-boot-ring {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(120, 200, 255, 0.22);
        border-top-color: rgba(150, 215, 255, 0.95);
        animation: sa-boot-spin 900ms linear infinite;
      }
      @keyframes sa-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sa-boot-ring {
          animation-duration: 2600ms;
        }
      }
      .sa-boot-stages {
        display: flex;
        gap: 5px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .sa-boot-stages li {
        width: 16px;
        height: 2px;
        background: rgba(120, 200, 255, 0.2);
        transition: background 260ms ease-out;
      }
      .sa-boot-stages li[data-state="active"] {
        background: rgba(150, 215, 255, 0.55);
      }
      .sa-boot-stages li[data-state="ok"] {
        background: rgba(150, 215, 255, 0.95);
      }
      .sa-boot-stages li[data-state="warn"] {
        background: #ffb545;
      }
      .sa-boot-stages li[data-state="fail"] {
        background: #ff5d6c;
      }

      /* ---------- the outcome the player carries into the menu ---------- */
      .sa-boot-note {
        justify-self: center;
        align-self: end;
        max-width: min(520px, 88vw);
        margin-bottom: 46px;
        font-size: 11.5px;
        letter-spacing: 0.06em;
        text-align: center;
        color: rgba(190, 215, 245, 0.75);
        text-wrap: balance;
      }
      .sa-boot-note[data-tone="warn"] {
        color: #ffb545;
      }
      /* A boot that threw has no menu to reach: keep the reason on screen and
         stop pretending anything is still loading. */
      #sa-boot[data-state="failed"] .sa-boot-ring {
        animation: none;
        border-top-color: #ff5d6c;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud"></div>

    <!-- Static so it paints with the first frame the browser draws; driven from
         src/game/screens/BootScreen.ts once the module graph is up. -->
    <div id="sa-boot" role="status" aria-live="polite" data-phase="publisher">
      <canvas class="sa-boot-sky" id="sa-boot-sky" aria-hidden="true"></canvas>
      <div class="sa-boot-publisher"><b>SEPTENTRION GAMES</b><i aria-hidden="true"></i></div>
      <div class="sa-boot-titlecard">
        <h1 class="sa-boot-wordmark">ORION'S ARM</h1>
        <div class="sa-boot-rule" aria-hidden="true"></div>
        <div class="sa-boot-sub" data-boot-sub>LOADING</div>
      </div>
      <div class="sa-boot-loader">
        <ol class="sa-boot-stages">
          <li data-boot-stage="content" data-state="pending"><span class="sr-only">Content pack</span></li>
          <li data-boot-stage="interface" data-state="pending"><span class="sr-only">Menu interface</span></li>
          <li data-boot-stage="server" data-state="pending"><span class="sr-only">Server</span></li>
        </ol>
        <i class="sa-boot-ring" aria-hidden="true"></i>
      </div>
      <div class="sa-boot-note" data-boot-note></div>
    </div>


    <!-- ======================================================================
         Title-screen backdrop: a live nebula, rendered by an inline WebGL
         shader.

         INLINE and dependency-free on purpose. This is the same rule the boot
         markup follows — it has to be able to run before the module graph, the
         engine or the content pack exist, because it IS what the player looks
         at while those load. Importing anything would put it behind the very
         wait it covers.

         Everything degrades rather than throws: no WebGL, a failed compile or a
         lost context all leave the canvas transparent over the black backdrop,
         which is the boot screen's own colour. The loop stops the moment the
         node leaves the document, so it cannot outlive the launch sequence and
         steal frames from the game.
         ====================================================================== -->
    <script>
      (function () {
        var canvas = document.getElementById("sa-boot-sky");
        if (!canvas) return;
        var gl = null;
        try {
          gl = canvas.getContext("webgl", { alpha: true, antialias: false, depth: false });
        } catch (e) {
          return;
        }
        if (!gl) return;

        var VERT =
          "attribute vec2 p;varying vec2 uv;void main(){uv=p;gl_Position=vec4(p,0.,1.);}";

        // A star, not a backdrop: granulated photosphere with limb darkening,
        // a corona of radial filaments that churn, and a bloom halo. All of it
        // is fbm over value noise — the trick that sells it is DOMAIN WARPING
        // (feeding noise its own output as a coordinate), which is what turns
        // smooth blobs into the turbulent cell structure a real photosphere has.
        //
        // The corona is sampled in POLAR space (angle, radius) rather than
        // cartesian, so its filaments stream outward from the limb instead of
        // drifting sideways past it.
        var FRAG = [
          "precision highp float;",
          "varying vec2 uv;",
          "uniform float t;",
          "uniform vec2 res;",
          "uniform vec2 sun;",
          "float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
          "float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
          " return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}",
          "float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<6;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}",
          "void main(){",
          " vec2 q=uv*vec2(res.x/res.y,1.);",
          " vec2 d=q-sun;",
          " float dist=max(length(d),1e-4);",
          " float r=dist/0.26;",
          // Direction, not angle. atan() has a branch cut at ±pi and sampling
          // noise across it leaves a seam straight through the corona; a unit
          // vector wraps continuously, so the filaments close on themselves.
          " vec2 nd=d/dist;",
          " float cr=max(r-1.0,0.);",
          " vec3 col=vec3(0.);",
          // --- photosphere: warped fbm granulation, hot core to cooler limb ---
          " float core=smoothstep(1.03,0.95,r);",
          " if(core>0.){",
          "  vec2 sp=d*9.0;",
          "  vec2 w=vec2(fbm(sp+t*0.05),fbm(sp+vec2(3.1,1.7)-t*0.04));",
          "  float g=fbm(sp*2.1+w*2.6+vec2(0.,t*0.07));",
          // The disc is a sphere: its edge shows cooler, deeper plasma. Without
          // limb darkening it reads as a flat orange sticker.
          "  float limb=pow(max(1.-r*r,0.),0.36);",
          "  vec3 surf=mix(vec3(0.80,0.17,0.02),vec3(1.0,0.52,0.13),smoothstep(0.28,0.60,g));",
          "  surf=mix(surf,vec3(1.0,0.95,0.82),smoothstep(0.56,0.88,g)*limb);",
          "  col+=surf*(0.30+limb*2.6)*core;",
          " }",
          // --- chromosphere: the thin bright rim right at the limb ---
          " col+=vec3(1.0,0.46,0.13)*exp(-pow((r-1.0)*9.0,2.0))*1.5;",
          // --- corona: filaments streaming outward, churning slowly ---
          " float fil=fbm(nd*7.0+vec2(cr*1.3-t*0.15,t*0.05));",
          " fil=pow(max(fil-0.33,0.)*1.9,1.5);",
          " col+=vec3(1.0,0.58,0.22)*fil*exp(-cr*1.7)*2.2;",
          // --- glare: two smooth exponentials, never a hard band ---
          " col+=vec3(1.0,0.58,0.24)*exp(-cr*1.15)*0.42;",
          " col+=vec3(1.0,0.72,0.42)*exp(-cr*0.30)*0.055;",
          // --- stars, hidden by the disc and washed out by the glare ---
          " vec2 sp2=q*250.;vec2 si=floor(sp2);float sh=hash(si);",
          " float star=step(0.9972,sh)*(0.55+0.45*sin(t*2.1+sh*63.));",
          " star*=smoothstep(0.42,0.0,length(fract(sp2)-0.5));",
          " col+=vec3(0.82,0.90,1.0)*star*smoothstep(1.2,3.2,r);",
          // Deep space is not pure black, and the core must not clip flat.
          " col+=vec3(0.012,0.011,0.020);",
          " col=col/(1.0+col*0.42);",
          " gl_FragColor=vec4(col,1.);",
          "}",
        ].join("\n");

        function compile(type, src) {
          var sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;
        }
        var vs = compile(gl.VERTEX_SHADER, VERT);
        var fs = compile(gl.FRAGMENT_SHADER, FRAG);
        if (!vs || !fs) return;
        var prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
        gl.useProgram(prog);

        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(prog, "p");
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        var uT = gl.getUniformLocation(prog, "t");
        var uRes = gl.getUniformLocation(prog, "res");
        var uSun = gl.getUniformLocation(prog, "sun");

        // Half-resolution, capped: this runs while the engine is still booting
        // and must not compete with it for GPU time. The blur it costs is
        // invisible on a nebula.
        function resize() {
          var scale = Math.min(window.devicePixelRatio || 1, 1.5) * 0.5;
          var w = Math.max(1, Math.round(canvas.clientWidth * scale));
          var h = Math.max(1, Math.round(canvas.clientHeight * scale));
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
            gl.viewport(0, 0, w, h);
          }
          gl.uniform2f(uRes, w, h);
          // The sun sits off to the upper left so the wordmark has clean frame
          // to sit in — the layout in the design note. On a portrait screen
          // there is no room beside it, so it moves up and centres instead.
          var portrait = h > w;
          gl.uniform2f(uSun, portrait ? -0.02 : -1.02, portrait ? 0.52 : 0.30);
        }

        var start = performance.now();
        function frame(now) {
          // The launch screen removes itself when the menu is ready; that is
          // this loop's stop condition, so it can never outlive the sequence.
          if (!canvas.isConnected) return;
          resize();
          gl.uniform1f(uT, (now - start) / 1000);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

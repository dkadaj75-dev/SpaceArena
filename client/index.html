<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Space Arena</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05070d;
        overflow: hidden;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }

      #fpsCounter {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: 8px;
        margin-top: 6px;
        padding: 2px 8px;
        font: 12px/1.4 monospace;
        color: #9be8ff;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="fpsCounter">FPS: --</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

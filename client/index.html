<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Space Arena</title>
    <meta name="description" content="One-thumb tactical space combat. Fit your ship, manage heat, win the arena." />

    <!-- PWA (ROADMAP §11 6.5). The manifest + service worker are injected at
         build time by vite-plugin-pwa; these tags are what the browser needs
         before the manifest is parsed, plus the iOS-only equivalents. -->
    <meta name="theme-color" content="#0a0f1e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Space Arena" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05070d;
        overflow: hidden;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }

      /* ==========================================================
         Boot loading screen (driven by src/game/screens/BootScreen.ts)

         Deliberately inline, static markup with literal colours: this is the
         ONE surface that must be on screen before any JavaScript runs — before
         the module graph is fetched, before the content pack (and therefore the
         theme) exists. Anything theme-driven here could only appear after the
         very wait it is meant to explain. The palette matches
         content/themes/default.json's `--hud-*` family so the hand-off into the
         menu is seamless; the shape language (chamfered panel, hairline rim,
         scan sweep, stage list) is the same one hudStyle.ts and screenStyle.ts
         carry once they load.
         ========================================================== */
      #sa-boot {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-right, 0px) + 16px)
          calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 16px);
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #dbe9ff;
        background:
          radial-gradient(60% 45% at 22% 24%, rgba(15, 79, 122, 0.5) 0%, transparent 70%),
          radial-gradient(55% 40% at 80% 78%, rgba(122, 58, 18, 0.42) 0%, transparent 72%),
          #05070d;
        opacity: 1;
        transition: opacity 320ms ease-out;
      }
      /* BootScreen.dismiss() sets this, then removes the node after the fade. */
      #sa-boot[data-state="done"] {
        opacity: 0;
        pointer-events: none;
      }

      .sa-boot-panel {
        position: relative;
        width: min(360px, 100%);
        padding: 26px 24px 20px;
        box-sizing: border-box;
        /* Rim colour on the box, fill plate on ::before — the same chamfered
           two-layer frame the HUD and menu stylesheets use, because clip-path
           would cut a plain border's corners off and leave the bevel unlined. */
        background: rgba(57, 191, 255, 0.34);
        clip-path: polygon(
          14px 0%,
          calc(100% - 14px) 0%,
          100% 14px,
          100% calc(100% - 14px),
          calc(100% - 14px) 100%,
          14px 100%,
          0% calc(100% - 14px),
          0% 14px
        );
      }
      .sa-boot-panel::before {
        content: "";
        position: absolute;
        inset: 1px;
        clip-path: inherit;
        background: rgba(11, 21, 38, 0.94);
      }
      .sa-boot-panel > * {
        position: relative;
      }

      .sa-boot-title {
        font-size: clamp(19px, 6.5vw, 26px);
        font-weight: 500;
        letter-spacing: 0.32em;
        text-align: center;
        color: #39bfff;
        text-shadow: 0 0 18px rgba(57, 191, 255, 0.55), 0 0 44px rgba(57, 191, 255, 0.25);
        /* Tracking adds a trailing gap; nudge the block back into optical centre. */
        padding-left: 0.32em;
      }
      .sa-boot-rule {
        height: 1px;
        margin: 10px 0 12px;
        background: linear-gradient(90deg, transparent, #39bfff, #ffb35c, transparent);
        opacity: 0.85;
      }
      .sa-boot-sub {
        font-size: 9.5px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        text-align: center;
        color: #8ba3c4;
        min-height: 1.2em;
      }

      /* Progress bar: a settled-stage fill plus a scan sweep that runs the whole
         time, so the screen never looks frozen while one long stage works. */
      .sa-boot-bar {
        position: relative;
        height: 4px;
        margin: 14px 0 16px;
        overflow: hidden;
        background: rgba(57, 191, 255, 0.12);
        box-shadow: inset 0 0 0 1px rgba(57, 191, 255, 0.24);
      }
      .sa-boot-bar .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, rgba(57, 191, 255, 0.5), #39bfff);
        transition: width 280ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .sa-boot-bar .scan {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 34%;
        background: linear-gradient(90deg, transparent, rgba(219, 233, 255, 0.7), transparent);
        animation: sa-boot-scan 1.5s linear infinite;
      }
      @keyframes sa-boot-scan {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(400%);
        }
      }

      .sa-boot-stages {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .sa-boot-stages li {
        display: flex;
        align-items: baseline;
        gap: 9px;
        font-size: 12px;
        letter-spacing: 0.03em;
        color: #5d76a0;
        transition: color 160ms linear;
      }
      .sa-boot-stages .mark {
        flex: 0 0 auto;
        width: 12px;
        font-style: normal;
        font-size: 11px;
        text-align: center;
      }
      .sa-boot-stages .mark::before {
        content: "·";
      }
      .sa-boot-stages .detail {
        font-size: 10.5px;
        color: #5d76a0;
      }
      /* No stage detail yet: collapse it so the flex gap does not open a hole. */
      .sa-boot-stages .detail:empty {
        display: none;
      }
      .sa-boot-stages li[data-state="active"] {
        color: #dbe9ff;
      }
      .sa-boot-stages li[data-state="active"] .mark {
        color: #39bfff;
      }
      .sa-boot-stages li[data-state="active"] .mark::before {
        content: "»";
        animation: sa-boot-blink 0.9s ease-in-out infinite;
      }
      .sa-boot-stages li[data-state="ok"] {
        color: #a8c2e4;
      }
      .sa-boot-stages li[data-state="ok"] .mark {
        color: #4ee6b8;
      }
      .sa-boot-stages li[data-state="ok"] .mark::before {
        content: "\2713";
      }
      .sa-boot-stages li[data-state="warn"] {
        color: #ffb35c;
      }
      .sa-boot-stages li[data-state="warn"] .mark {
        color: #ffb35c;
      }
      .sa-boot-stages li[data-state="warn"] .mark::before {
        content: "!";
      }
      .sa-boot-stages li[data-state="fail"] {
        color: #ff405c;
      }
      .sa-boot-stages li[data-state="fail"] .mark {
        color: #ff405c;
      }
      .sa-boot-stages li[data-state="fail"] .mark::before {
        content: "\2715";
      }
      @keyframes sa-boot-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .sa-boot-note {
        margin-top: 14px;
        min-height: 1.3em;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-align: center;
        color: #5d76a0;
      }
      .sa-boot-note[data-tone="warn"] {
        color: #ffb35c;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      #sa-boot[data-state="failed"] .sa-boot-bar .scan {
        animation: none;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .sa-boot-bar .scan,
        .sa-boot-stages li[data-state="active"] .mark::before {
          animation: none;
        }
        #sa-boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud"></div>

    <!-- Static so it paints with the first frame the browser draws; driven from
         src/game/screens/BootScreen.ts once the module graph is up. -->
    <div id="sa-boot" role="status" aria-live="polite">
      <div class="sa-boot-panel">
        <div class="sa-boot-title">SPACE ARENA</div>
        <div class="sa-boot-rule" aria-hidden="true"></div>
        <div class="sa-boot-sub" data-boot-sub>BOOTING SYSTEMS</div>
        <div class="sa-boot-bar" aria-hidden="true">
          <i class="fill" data-boot-fill></i>
          <i class="scan"></i>
        </div>
        <ol class="sa-boot-stages">
          <li data-boot-stage="content" data-state="pending">
            <i class="mark" aria-hidden="true"></i><span class="text">Loading content pack</span
            ><span class="detail" data-boot-detail></span>
          </li>
          <li data-boot-stage="assets" data-state="pending">
            <i class="mark" aria-hidden="true"></i><span class="text">Loading ship assets</span
            ><span class="detail" data-boot-detail></span>
          </li>
          <li data-boot-stage="server" data-state="pending">
            <i class="mark" aria-hidden="true"></i><span class="text">Contacting server</span
            ><span class="detail" data-boot-detail></span>
          </li>
        </ol>
        <div class="sa-boot-note" data-boot-note></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
